name: Record retail prices

on:
  schedule:
    # 每小时记录一次，GitHub Actions 使用 UTC 时间
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest prices
        run: node scripts/fetch_prices.js

      - name: Commit updated history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add history.json
          git commit -m "Record latest retail prices" || echo "No changes to commit"
          git push
